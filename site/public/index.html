<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweyt Incentive</title>
<meta name="description" content="Sweyt Incentive — commissions and incentive plans.">
<meta name="theme-color" content="#0B0D0C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D0C;
    --fg: #FFFFFF;
    --accent: #2BD67B;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .logo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15em;
    font-size: clamp(48px, 12vw, 120px);
    line-height: 1;
  }
  .word {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    letter-spacing: -0.0375em;
  }
  .word .dollar { color: var(--accent); }
  .sub {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 0.325em;
    letter-spacing: 0.42em;
    color: var(--accent);
    padding-left: 0.1em;
  }
</style>
</head>
<body>
  <h1 class="logo" aria-label="Sweyt Incentive">
    <span class="word" aria-hidden="true"><span class="dollar">$</span>weyt</span>
    <span class="sub" aria-hidden="true">INCENTIVE</span>
  </h1>
</body>
</html>
